name: Deploy to shared hosting

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  test:
    name: Verify application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug

      - name: Run test suite
        run: php tests/run.php

      - name: Check code coverage
        run: php tests/coverage.php

  deploy:
    name: Upload production files
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          WORK_DIR: ${{ secrets.WORK_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

          ssh_options=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes)
          archive="$RUNNER_TEMP/php-snake.tar.gz"

          tar --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./tests' \
            --exclude='./README.md' \
            --exclude='./snake-mind-map.excalidraw' \
            -czf "$archive" .

          remote="$SSH_USER@$SSH_HOST"
          remote_archive="/tmp/php-snake-$GITHUB_RUN_ID.tar.gz"
          scp "${ssh_options[@]}" "$archive" "$remote:$remote_archive"
          ssh "${ssh_options[@]}" "$remote" "mkdir -p -- $(printf '%q' "$WORK_DIR") && tar -xzf $(printf '%q' "$remote_archive") -C $(printf '%q' "$WORK_DIR") && rm -f $(printf '%q' "$remote_archive")"
